name: fetch-stock-clips
on:
  push:
    paths:
      - '.github/workflows/fetch-audio.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pexels free stock clips
        run: |
          curl -L --fail --retry 3 'https://videos.pexels.com/video-files/11272939/11272939-hd_1080_1920_25fps.mp4' -o dawn.mp4 || curl -L --fail --retry 3 'https://videos.pexels.com/video-files/11272939/11272939-uhd_2160_3840_25fps.mp4' -o dawn.mp4
          curl -L --fail --retry 3 'https://videos.pexels.com/video-files/6305036/6305036-hd_1920_1080_25fps.mp4' -o family.mp4 || curl -L --fail --retry 3 'https://videos.pexels.com/video-files/6305036/6305036-uhd_3840_2160_25fps.mp4' -o family.mp4
          curl -L --fail --retry 3 'https://videos.pexels.com/video-files/8477565/8477565-hd_1920_1080_25fps.mp4' -o rain.mp4
          curl -L --fail --retry 3 'https://videos.pexels.com/video-files/4154532/4154532-hd_1920_1080_24fps.mp4' -o fire.mp4 || curl -L --fail --retry 3 'https://videos.pexels.com/video-files/4154532/4154532-uhd_3840_2160_24fps.mp4' -o fire.mp4
          file *.mp4
          ls -lh *.mp4
      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: pexels-stock-clips
          path: '*.mp4'
          retention-days: 1
